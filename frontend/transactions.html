<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orçamento | MoneyWise</title>
    <meta name="description" content="Definição de limites mensais por categoria e % de comprometimento." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">  
  </head>
  <body>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="logo" href="dashboard.html">Money<span>Wise</span></a>
        <nav class="nav">
          <a href="dashboard.html">Painel</a>
          <a href="transacoes.html">Transações</a>
          <a href="orcamento.html">Orçamento</a>
          <a href="projecao.html">Projeção</a>
          <a href="wireframes.html">Wireframes</a>
          <a href="index.html">Sair</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <h1>Transações</h1>
      <p class="subtitulo">Registre receitas e despesas com descrição, valor, data e categoria.</p>

      <section class="grid grid-2">
        <form class="card" id="form-transacao" novalidate>
          <h2>Nova transação</h2>

          <div class="campo">
            <label for="tipo">Tipo</label>
            <select id="tipo">
              <option value="RECEITA">Receita</option>
              <option value="DESPESA">Despesa</option>
            </select>
            <span class="erro" data-erro="tipo"></span>
          </div>

          <div class="campo">
            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" placeholder="Ex.: Supermercado" />
            <span class="erro" data-erro="descricao"></span>
          </div>

          <div class="campo">
            <label for="valor">Valor (R$)</label>
            <input type="number" id="valor" step="0.01" min="0.01" placeholder="0,00" />
            <span class="erro" data-erro="valor"></span>
          </div>

          <div class="campo">
            <label for="categoria">Categoria</label>
            <select id="categoria">
              <option value="">Selecione...</option>
            </select>
            <span class="erro" data-erro="categoria"></span>
          </div>

          <div class="campo">
            <label for="data">Data</label>
            <input type="date" id="data" />
            <span class="erro" data-erro="data"></span>
          </div>

          <div class="linha-botoes">
            <button type="submit" class="btn">Salvar</button>
            <button type="reset" class="btn btn-sec">Limpar</button>
          </div>
        </form>

        <div class="card">
          <h2>Resumo</h2>
          <div class="kpi" style="box-shadow: none; margin-bottom: 12px">
            <div class="rotulo">Saldo</div>
            <div class="valor" id="resumo-saldo">R$ 0,00</div>
          </div>
          <div class="campo">
            <label for="filtro">Filtrar por categoria</label>
            <select id="filtro">
              <option value="">Todas</option>
            </select>
          </div>
          <p class="vazio" id="contador"></p>
        </div>
      </section>

      <section class="card">
        <h2>Lançamentos</h2>
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Descrição</th>
              <th>Categoria</th>
              <th>Tipo</th>
              <th style="text-align: right">Valor</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tabela"></tbody>
        </table>
      </section>

      <footer class="rodape">MoneyWise — protótipo front-end (Etapa 8)</footer>
    </main>

    <script src="js/app.js"></script>
    <script src="js/validacao.js"></script>
    <script src="js/transacoes.js"></script>
  </body>
</html>
